<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Page Title</title>
    <style>
      /* Reset some default styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Body styles */
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #00b4db, #af37d0);
        margin: 0;
        padding: 0;
        color: #333;
      }

      /* Header styles */
      header {
        background-color: #ff3333;
        padding: 20px 0;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 48px;
        font-weight: bold;
        letter-spacing: 2px;
        background: linear-gradient(to right, #00b4db, #af37d0);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Navbar styles */
      .navbar {
        background-color: #333;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        padding: 10px 0;
        text-align: center;
      }

      .navbar a {
        text-decoration: none;
        margin: 0 20px;
        position: relative;
        font-size: 18px;
        color: #fff;
        transition: color 0.3s ease;
      }

      .navbar a:before {
        content: "";
        position: absolute;
        width: 100%;
        height: 2px;
        bottom: -4px;
        left: 0;
        background-color: #ff3333;
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 0.3s ease;
      }

      .navbar a:hover {
        color: #ff3333;
      }

      .navbar a:hover:before {
        transform: scaleX(1);
      }

      /* Content container styles */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      /* Example content styles */
      .content {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      }
      /* Generate Button */
      #generate {
        background-color: #ff3333;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 10px 20px; /* Decrease the size */
        font-size: 16px; /* Decrease the font size */
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease; /* Add hover effect */
      }

      /* Style the button on hover */
      #generate:hover {
        background-color: #ff5555;
        background-color: #ff5555;
        transform: scale(1.05); /* Add a slight scale effect on hover */
      }

      /* Footer styles */
      footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 10px 0;
        position: relative; /* Position at the bottom */
        overflow: auto;
        width: 100%; /* Take the full width */
        bottom: 0; /* Stick to the bottom */
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>Australian Special Operations Taskforce</h1>
    </header>

    <!-- Navbar -->
    <div class="navbar">
      <div class="container">
        <a href="/">Uniform</a>
        <a href="/certificates">Certificates</a>
        <a href="/box">Boxes</a>
      </div>
    </div>

    <!-- Content container -->
    <div class="container">
      <div class="content">

  <head>
    <title>Medal Box</title>
    <select id="dropdown" multiple="true"></select>

    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter text here" />
    <script>
      fetch("/get-medals", {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
        },
      })
        .then((response) => response.json())
        .then((data) => {
          console.log(data);
          files = data.files;

          var dropdown = document.getElementById("dropdown");
          //   var files = ["file1.txt", "file2.txt", "file3.txt"];

          for (var i = 0; i < files.length; i++) {
            var option = document.createElement("option");
            option.value = files[i];
            option.textContent = files[i];
            dropdown.appendChild(option);
          }
          var button = document.getElementById("gen");
          button
            .addEventListener("click", () => {
              const selected = document.querySelectorAll(
                "#dropdown option:checked"
              );
              const values = Array.from(selected).map((el) => el.value);
              console.log(values);
              fetch("/generate-box", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  medals: values.map((x) => x.split(".")[0]),
                  name: document.getElementById("name").value,
                }),
              })
                .then((response) => response.blob())
                .then((imageBlob) => {
                  // Create a URL for the image blob
                  var imageUrl = URL.createObjectURL(imageBlob);
                  // Create an <img> element
                  var imgElement = document.createElement("img");
                  console.log(imageUrl);

                  // Set the source of the image to the generated image
                  imgElement.src = imageUrl;

                  // Append the image element to the "imageContainer" div
                  document
                    .getElementById("imageContainer")
                    .appendChild(imgElement);
                });
            })
            .catch((error) => {
              console.error("Error:", error);
            });
        });
    </script>
    <br />
    <button id="gen">Generate</button>
    <a href="/">Milpacs</a>
    <a href="/certificates"> Certificates</a>
    <style>
      /* Add CSS styles for the dropdown */
      #dropdown {
        width: 400px; /* Set the width as desired */
        height: 525px; /* Set the height as desired */
      }
    </style>
  </head>
  </div>
  </div>
  <body>
    <div id="imageContainer"></div>
  </body>
   <!-- Footer -->
    <footer>&copy; 2023 Australian Special Operations Taskforce</footer>
</html>
