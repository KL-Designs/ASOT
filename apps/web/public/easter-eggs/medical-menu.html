<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HZN-MED · Medical Menu (Mockup)</title>
<style>
/* ============================================================
   HORIZONS MEDICAL SYSTEM — Medical Menu mockup
   Parody / reskin of the ARMA 3 ACE + KAT medical interface.
   Single file. No dependencies. All state is client-side mock data.
   ------------------------------------------------------------
   Integration notes are at the bottom of the <script> block.
   ============================================================ */

:root{
  --hz-orange:      #d9a441;
  --hz-orange-dk:   #8a6220;
  --hz-bar:         linear-gradient(180deg,#e0b155 0%,#c8912f 45%,#a4741f 100%);
  --panel:          rgba(14,16,15,.72);
  --panel-solid:    #14171a;
  --panel-line:     rgba(255,255,255,.22);
  --panel-line-sub: rgba(255,255,255,.10);
  --txt:            #eef1f2;
  --txt-dim:        #a9b0b3;
  --txt-mute:       #6e7679;
  --red:            #e03b31;
  --red-dk:         #8d1f19;
  --yellow:         #e8c343;
  --green:          #5cbf62;
  --blue:           #56a8e0;
  --tan:            #cbbf9d;
  --hit:            rgba(255,255,255,.06);
  --hit-on:         rgba(217,164,65,.22);
  --font: "Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",Arial,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); color:var(--txt);
  background:#0b0d0c; overflow:hidden;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
}

/* ---------- faux 3D scene behind the UI ---------- */
#scene{position:fixed; inset:0; z-index:0; overflow:hidden}
#scene .sky{position:absolute; inset:0;
  background:
    radial-gradient(120% 80% at 50% 8%, #b9a887 0%, #8e8467 38%, #5f5b46 62%, #2c2b22 100%);
  filter:saturate(.75);
}
#scene .ground{position:absolute; left:-10%; right:-10%; top:46%; bottom:-10%;
  background:
    radial-gradient(80% 60% at 50% 0%, rgba(0,0,0,.28), transparent 70%),
    linear-gradient(180deg,#6d6144 0%, #4c452f 45%, #2b271b 100%);
  transform:perspective(600px) rotateX(46deg);
  transform-origin:50% 0%;
}
#scene .haze{position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(180,170,140,.20), rgba(0,0,0,.55));
}
#scene .vig{position:absolute; inset:0;
  box-shadow:inset 0 0 240px 60px rgba(0,0,0,.85);
}
#scene .blur{position:absolute; inset:0; backdrop-filter:blur(2px)}
#scene .grain{position:absolute; inset:0; opacity:.16; mix-blend-mode:overlay;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px 3px);
}
/* medic silhouette + casualty blob, purely decorative */
#scene .medic{position:absolute; right:14%; bottom:-4%; width:38vw; height:70vh;
  background:radial-gradient(45% 40% at 50% 30%, rgba(38,40,28,.95), rgba(20,22,16,.0) 70%);
  filter:blur(6px);
}
#scene .blood{position:absolute; left:44%; bottom:16%; width:12vw; height:5vh;
  background:radial-gradient(50% 50% at 50% 50%, rgba(120,10,8,.85), rgba(90,8,6,0) 70%);
  filter:blur(3px);
}

/* ---------- window chrome ---------- */
#menu{position:relative; z-index:2; height:100vh; display:flex; flex-direction:column;
  padding:0 0 0 0;}

.titlebar{
  background:var(--hz-bar);
  border-bottom:1px solid rgba(0,0,0,.55);
  box-shadow:0 2px 10px rgba(0,0,0,.55);
  display:flex; align-items:center; gap:12px;
  padding:5px 14px; flex:0 0 auto;
}
.titlebar h1{
  margin:0; font-size:19px; font-weight:700; letter-spacing:.4px;
  color:#1b1408; text-shadow:0 1px 0 rgba(255,255,255,.28);
}
.titlebar .tag{
  font-size:10.5px; letter-spacing:1.6px; font-weight:700;
  color:#2a2110; background:rgba(255,255,255,.30);
  border:1px solid rgba(0,0,0,.28); border-radius:2px; padding:2px 6px;
}
.titlebar .spacer{flex:1}
.titlebar .meta{font-size:12.5px; color:#2a2110; letter-spacing:.6px; font-weight:600; opacity:.85}
.titlebar .xbtn{
  width:22px;height:20px;display:grid;place-items:center; cursor:pointer;
  color:#2a2110; font-weight:700; border:1px solid rgba(0,0,0,.25);
  background:rgba(255,255,255,.16); border-radius:2px; font-size:13px;
}
.titlebar .xbtn:hover{background:rgba(255,255,255,.34)}

/* ---------- main grid ---------- */
.grid{
  flex:1 1 auto; display:grid; min-height:0;
  grid-template-columns: minmax(340px, 1.05fr) minmax(320px, .95fr) minmax(320px, 1fr);
  gap:0; padding:6px 12px 0 12px;
}
.col{display:flex; flex-direction:column; min-height:0; padding:0 8px}
.colhead{
  text-align:center; font-size:19px; letter-spacing:1.2px; font-weight:700;
  padding:4px 0 6px; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.9);
  border-bottom:1px solid var(--panel-line);
}
.colhead.name{color:#fff}
.colhead .sub{display:block; font-size:11px; letter-spacing:2px; color:var(--tan); font-weight:600; opacity:.9}

/* ---------- toolbar ---------- */
.toolbar{display:flex; align-items:center; gap:2px; padding:6px 2px 6px; flex-wrap:wrap}
.tool{
  width:40px; height:40px; display:grid; place-items:center; cursor:pointer;
  border:1px solid transparent; border-radius:3px; color:#fff; opacity:.82;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.9)); position:relative;
}
.tool svg{width:26px;height:26px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.tool:hover{opacity:1; background:var(--hit); border-color:var(--panel-line-sub)}
.tool.on{opacity:1; color:var(--hz-orange); background:var(--hit-on); border-color:rgba(217,164,65,.55)}
.tool .kbd{position:absolute; right:2px; bottom:0; font-size:9px; color:var(--txt-mute)}
.tool .badge{position:absolute; left:2px; top:1px; font-size:9px; font-weight:700;
  color:#0b0d0c; background:var(--hz-orange); border-radius:6px; padding:0 4px; display:none}
.tool.flag .badge{display:block}
.toolsep{width:1px; height:26px; background:var(--panel-line); margin:0 6px}

/* ---------- panels ---------- */
.panel{
  background:var(--panel); border:1px solid var(--panel-line);
  box-shadow:inset 0 0 40px rgba(0,0,0,.35);
  flex:1 1 auto; min-height:0; overflow:auto; padding:8px 10px;
}
.panel::-webkit-scrollbar{width:9px}
.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}
.panel::-webkit-scrollbar-track{background:rgba(0,0,0,.25)}

.hint{color:var(--txt-dim); font-size:14px; padding:4px 2px}
.sectlabel{
  font-size:11px; letter-spacing:1.8px; color:var(--hz-orange); font-weight:700;
  margin:8px 2px 5px; padding-bottom:3px; border-bottom:1px solid rgba(217,164,65,.28);
}
.sectlabel:first-child{margin-top:2px}

/* treatment rows */
.trow{
  display:flex; align-items:center; gap:10px; width:100%;
  background:rgba(255,255,255,.045); border:1px solid var(--panel-line-sub);
  color:var(--txt); text-align:left; font-family:inherit; font-size:14.5px;
  padding:7px 10px; margin-bottom:3px; cursor:pointer; border-radius:2px;
}
.trow:hover:not(:disabled){background:rgba(217,164,65,.18); border-color:rgba(217,164,65,.5)}
.trow:active:not(:disabled){transform:translateY(1px)}
.trow:disabled{opacity:.34; cursor:not-allowed}
.trow .qty{margin-left:auto; font-size:12px; color:var(--txt-mute); letter-spacing:.5px}
.trow .dot{width:8px;height:8px;border-radius:50%;background:var(--txt-mute); flex:0 0 auto}
.trow .dot.g{background:var(--green)} .trow .dot.y{background:var(--yellow)}
.trow .dot.r{background:var(--red)}   .trow .dot.b{background:var(--blue)}

/* ---------- body diagram ---------- */
.bodywrap{
  flex:1 1 auto; min-height:0; position:relative;
  display:flex; align-items:center; justify-content:center; padding:4px 0 0;
}
#bodySvg{height:100%; max-height:100%; width:100%; overflow:visible}
.part{cursor:pointer; transition:fill .18s ease, stroke .18s ease}
.part:hover{stroke:#fff; stroke-width:2.5}
.part.sel{stroke:var(--hz-orange); stroke-width:3}
#bodySvg .lbl{fill:var(--txt-mute); font-size:11px; letter-spacing:1px; pointer-events:none}
.tqBand{pointer-events:none}
.fxIcon{pointer-events:none}

.selbar{
  flex:0 0 auto; text-align:center; background:rgba(0,0,0,.82);
  border:1px solid var(--panel-line-sub);
  padding:6px 0; font-size:17px; letter-spacing:1.2px; margin:4px 26px 0;
}
.selbar.none{color:var(--txt-dim)}
.legend{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
  font-size:10.5px; letter-spacing:.6px; color:var(--txt-dim); padding:6px 0 2px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:2px;
  vertical-align:-1px; border:1px solid rgba(0,0,0,.5)}

/* ---------- overview ---------- */
.ovline{font-size:16px; line-height:1.34; letter-spacing:.2px}
.ovline.red{color:var(--red); font-weight:700}
.ovline.yel{color:var(--yellow); font-weight:700}
.ovline.dim{color:var(--txt-dim)}
.ovpart{margin-top:14px}
.ovpart h4{margin:0 0 1px; font-size:16px; font-weight:600; letter-spacing:.4px; color:#fff}
.ovsub{font-size:15px; color:var(--txt)}
.ovsub.b{color:var(--txt-mute)}
.vitals{display:grid; grid-template-columns:repeat(2,1fr); gap:4px 10px; margin:6px 0 2px}
.vit{background:rgba(255,255,255,.05); border:1px solid var(--panel-line-sub); padding:5px 8px}
.vit .k{font-size:10px; letter-spacing:1.4px; color:var(--txt-mute)}
.vit .v{font-size:19px; font-weight:700; letter-spacing:.5px; line-height:1.1}
.vit .v small{font-size:11px; font-weight:600; color:var(--txt-dim); letter-spacing:1px}
.vit.warn .v{color:var(--yellow)} .vit.crit .v{color:var(--red)}
#ecg{width:100%; height:56px; display:block; background:rgba(0,0,0,.45);
  border:1px solid var(--panel-line-sub); margin-top:4px}
.bloodbar{height:12px; background:rgba(0,0,0,.55); border:1px solid var(--panel-line-sub); margin-top:4px}
.bloodbar > i{display:block; height:100%; background:linear-gradient(90deg,#7d1512,#d0322a); transition:width .4s}

/* ---------- bottom docks ---------- */
.docks{
  flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:0;
  border-top:1px solid var(--panel-line); margin-top:6px;
  background:linear-gradient(180deg, rgba(210,180,120,.20), rgba(0,0,0,0) 60%);
}
.dock{padding:2px 20px 8px; min-height:0; display:flex; flex-direction:column}
.dock > h3{
  margin:2px 0 4px; text-align:center; font-size:16px; letter-spacing:1.4px;
  color:#5aa9e8; font-weight:700; text-shadow:0 1px 4px #000; cursor:default;
}
.dockbody{height:132px; overflow:auto; background:rgba(0,0,0,.55);
  border:1px solid var(--panel-line-sub); padding:5px 8px; font-size:13px}
.dockbody::-webkit-scrollbar{width:8px}
.dockbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}
.logline{padding:1px 0; color:var(--txt-dim); letter-spacing:.2px}
.logline b{color:var(--txt); font-weight:600}
.logline .t{color:var(--hz-orange); font-variant-numeric:tabular-nums; margin-right:6px}
.logline.warn b{color:var(--yellow)} .logline.bad b{color:var(--red)}
.logline.good b{color:var(--green)}

.qvgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px}
.qv{background:rgba(255,255,255,.05); border:1px solid var(--panel-line-sub); padding:4px 7px}
.qv .k{font-size:9.5px; letter-spacing:1.2px; color:var(--txt-mute)}
.qv .v{font-size:15px; font-weight:700}
.qvfull{grid-column:1/-1}
.chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px}
.chip{font-size:11px; letter-spacing:.6px; padding:2px 7px; border-radius:2px;
  background:rgba(255,255,255,.08); border:1px solid var(--panel-line-sub); color:var(--txt-dim)}
.chip.r{color:#ffb3ad;border-color:rgba(224,59,49,.5);background:rgba(224,59,49,.16)}
.chip.g{color:#bdeec0;border-color:rgba(92,191,98,.5);background:rgba(92,191,98,.14)}
.chip.y{color:#f6e3a1;border-color:rgba(232,195,67,.5);background:rgba(232,195,67,.14)}
.chip.b{color:#bcdff7;border-color:rgba(86,168,224,.5);background:rgba(86,168,224,.14)}

/* triage tag buttons */
.triagerow{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:4px 0 8px}
.tri{padding:6px 2px; text-align:center; font-size:12px; letter-spacing:1px; font-weight:700;
  cursor:pointer; border:1px solid rgba(0,0,0,.5); color:#10120f; opacity:.55}
.tri:hover{opacity:.85} .tri.on{opacity:1; box-shadow:0 0 0 2px #fff inset}
.tri.minor{background:#5cbf62} .tri.delayed{background:#e8c343}
.tri.immediate{background:#e03b31} .tri.deceased{background:#2b2b2b; color:#e8e8e8}

.cardfield{display:flex; gap:6px; align-items:center; margin-bottom:4px}
.cardfield label{font-size:11px; letter-spacing:1.2px; color:var(--txt-mute); width:74px; flex:0 0 auto}
.cardfield input{flex:1; background:rgba(0,0,0,.5); border:1px solid var(--panel-line-sub);
  color:var(--txt); font-family:inherit; font-size:13.5px; padding:4px 6px}
.cardfield input:focus{outline:none; border-color:var(--hz-orange)}

.toastwrap{position:fixed; right:18px; top:52px; z-index:50;
  display:flex; flex-direction:column; gap:5px; align-items:flex-end; pointer-events:none}
.toast{background:rgba(0,0,0,.86); border:1px solid var(--hz-orange); color:#fff;
  padding:6px 14px; font-size:13.5px; letter-spacing:.5px; animation:tin .25s ease}
@keyframes tin{from{opacity:0; transform:translateX(12px)}to{opacity:1}}

.footnote{position:fixed; right:10px; bottom:4px; z-index:40; font-size:10px;
  letter-spacing:1.2px; color:rgba(255,255,255,.28)}

@media (max-width:1180px){
  .grid{grid-template-columns:1fr 1fr; grid-template-rows:auto auto}
  .col.overview{grid-column:1/-1}
  .dockbody{height:104px}
}
</style>
</head>
<body>

<div id="scene">
  <div class="sky"></div><div class="ground"></div><div class="medic"></div>
  <div class="blood"></div><div class="haze"></div><div class="grain"></div>
  <div class="blur"></div><div class="vig"></div>
</div>

<div id="menu">

  <div class="titlebar">
    <h1>Medical Menu</h1>
    <span class="tag">HZN-MED</span>
    <span class="tag" style="background:rgba(0,0,0,.18);color:#3a2d12">MOCKUP v0.1</span>
    <span class="spacer"></span>
    <span class="meta" id="clock">MISSION 00:00:00</span>
    <span class="meta">MEDIC · <b>DOC-1 KODA</b></span>
    <span class="xbtn" title="Close (mockup only)">✕</span>
  </div>

  <div class="grid">

    <!-- ============ LEFT : EXAMINE & TREATMENT ============ -->
    <div class="col">
      <div class="colhead">EXAMINE &amp; TREATMENT</div>
      <div class="toolbar" id="toolbar"></div>
      <div class="panel" id="treatPanel"></div>
    </div>

    <!-- ============ CENTER : PATIENT ============ -->
    <div class="col">
      <div class="colhead name" id="patName">Noah Williams
        <span class="sub" id="patSub">"VULTURE" · 2-1 BRAVO · RIFLEMAN</span></div>
      <div class="bodywrap">
        <svg id="bodySvg" viewBox="0 0 300 640" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="selbar none" id="selBar">None</div>
      <div class="legend">
        <span><i style="background:#e6e9ec"></i>Healthy</span>
        <span><i style="background:#f0d47e"></i>Light</span>
        <span><i style="background:#e08a3c"></i>Moderate</span>
        <span><i style="background:#d2352c"></i>Severe</span>
        <span><i style="background:#8fd0f5"></i>Treated</span>
      </div>
    </div>

    <!-- ============ RIGHT : OVERVIEW ============ -->
    <div class="col overview">
      <div class="colhead">OVERVIEW</div>
      <div class="panel" id="ovPanel"></div>
    </div>
  </div>

  <!-- ============ BOTTOM DOCKS ============ -->
  <div class="docks">
    <div class="dock">
      <h3>ACTIVITY LOG</h3>
      <div class="dockbody" id="logBody"></div>
    </div>
    <div class="dock">
      <h3>QUICK VIEW</h3>
      <div class="dockbody" id="qvBody"></div>
    </div>
  </div>
</div>

<div class="toastwrap" id="toasts"></div>
<div class="footnote">MOCKUP — NOT A LIVE PATIENT RECORD</div>

<script>
/* ================================================================
   1. DATA MODEL
   ================================================================ */

const PARTS = [
  {id:'head',  name:'Head'},
  {id:'torso', name:'Torso'},
  {id:'armL',  name:'Left Arm'},
  {id:'armR',  name:'Right Arm'},
  {id:'legL',  name:'Left Leg'},
  {id:'legR',  name:'Right Leg'}
];

/* wound catalogue — {name, sev 1-3, bleedRate} */
const WOUND_TYPES = {
  scrape:   {name:'Small Abrasion',          sev:1, bleed:0.4},
  cut:      {name:'Medium Cut',              sev:1, bleed:0.8},
  avulsion: {name:'Medium Avulsion',         sev:2, bleed:1.4},
  mvw:      {name:'Medium Velocity Wound',   sev:2, bleed:2.0},
  hvw:      {name:'High Velocity Wound',     sev:3, bleed:3.4},
  frag:     {name:'Large Fragmentation Wound',sev:3, bleed:3.0},
  crush:    {name:'Large Crush Wound',       sev:3, bleed:1.6}
};

function mkPart(id){
  return {id, wounds:[], fractured:false, tourniquet:false,
          splinted:false, iv:0, checked:false};
}

function newPatient(){
  const p = {
    name:'Noah Williams', callsign:'"VULTURE"', unit:'2-1 BRAVO · RIFLEMAN',
    bloodType:'O POS', bloodTypeKnown:false,
    parts:Object.fromEntries(PARTS.map(x=>[x.id, mkPart(x.id)])),
    blood: 82,            // % volume
    pain: 62,             // 0-100
    hr: 118, sysBp:96, diaBp:58, spo2:93, rr:22, etco2:36, temp:36.4,
    conscious:true, cardiacArrest:false, airway:'clear',
    meds:[],  tqCount:0,
    triage:'none', triageEntries:[],
    cprActive:false
  };
  // starting injuries — mirrors the reference screenshot
  p.parts.legR.wounds.push({t:'mvw', n:2, bandaged:false});
  p.parts.legR.wounds.push({t:'avulsion', n:1, bandaged:true});
  p.parts.legR.fractured = true;
  p.parts.torso.wounds.push({t:'scrape', n:1, bandaged:false});
  return p;
}

const S = {
  patient: newPatient(),
  sel: null,          // selected body part id
  tool: 'examine',
  dock: 'log',
  log: [],
  t0: Date.now() - 1000*60*37   // mission clock starts at 37 min
};

/* ================================================================
   2. TOOL / TREATMENT DEFINITIONS
   ================================================================ */

const ICONS = {
  triage:`<svg viewBox="0 0 24 24"><path d="M7 3h10v18l-5-3-5 3z"/><path d="M12 8v6M9 11h6"/></svg>`,
  examine:`<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/><path d="M11 8v6M8 11h6"/></svg>`,
  bandage:`<svg viewBox="0 0 24 24"><rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-38 12 12)"/><path d="M10 10.5l3.5 3.5M13 9l1.5 1.5M9 12.5l1.5 1.5"/></svg>`,
  medication:`<svg viewBox="0 0 24 24"><rect x="6" y="7" width="12" height="14" rx="2"/><path d="M9 4h6v3H9z"/><path d="M12 11v6M9 14h6"/></svg>`,
  airway:`<svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M12 9v6M8.5 12h7M9 21l1.5-6M15 21l-1.5-6"/></svg>`,
  advanced:`<svg viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 2.5-8 1.8 4H22"/></svg>`,
  splint:`<svg viewBox="0 0 24 24"><path d="M5 19 19 5"/><path d="M4 6l3-3 3 3-3 3z"/><path d="M14 18l3-3 3 3-3 3z"/></svg>`,
  drag:`<svg viewBox="0 0 24 24"><circle cx="9" cy="4.5" r="2"/><path d="M9 7l-2 5 3 3 1 6M9 12l-4 2M12 10l4 2"/><path d="M17 20h4"/></svg>`,
  transfer:`<svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="2.6"/><circle cx="17" cy="7" r="2.6"/><path d="M3 19c0-3 2-5 4-5s4 2 4 5M13 19c0-3 2-5 4-5s4 2 4 5"/><path d="M9.5 3.5 12 2l-2.5-1.5" transform="translate(0 2)"/></svg>`
};

const TOOLS = [
  {id:'triage',     label:'Triage Card'},
  {id:'examine',    label:'Examine'},
  {id:'bandage',    label:'Bandages'},
  {id:'medication', label:'Medication'},
  {id:'airway',     label:'Airway & Chest'},
  {id:'advanced',   label:'Advanced Treatment'},
  {id:'splint',     label:'Splints & Fractures'},
  {id:'drag',       label:'Drag / Carry'},
  {id:'transfer',   label:'Handover / Transfer'}
];
const TOOL_SEPS = new Set(['triage','advanced']); // draw a separator after these

/* Each action: {id, label, note, dot, needsPart, run(p, partId)} */
const ACTIONS = {
  examine:[
    {sec:'Diagnostics'},
    {id:'pulse', label:'Check Pulse', note:'Stethoscope', dot:'b', run:p=>{
      const v = p.cardiacArrest ? 'no pulse detected' : `${jitter(p.hr,3)} bpm`;

/* ================================================================
   3. HELPERS
   ================================================================ */
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const jitter=(v,d)=>Math.round(v + (Math.random()*2-1)*d);
const pName = id => (PARTS.find(p=>p.id===id)||{}).name || id;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function bandage(p, id, kind, power){
  const pt = p.parts[id];
  const open = pt.wounds.filter(w=>!w.bandaged);
  if(!open.length) return ['No open wounds on the '+pName(id),'warn'];
  let left = power;
  for(const w of open){ if(left<=0) break; w.bandaged = true; left--; }
  const done = power - Math.max(0,left);
  p.pain = clamp(p.pain-4,0,100);
  return [`${kind} applied — ${pName(id)} · ${Math.min(done,open.length)} wound(s) dressed`,'good'];
}
function med(p, name, eff){
  if(p.meds.filter(m=>m===name).length>=3) return [name+' — max dose reached, refused','bad'];
  p.meds.push(name);
  for(const k in eff){ p[k] = clamp(p[k] + eff[k], 0, k==='pain'?100:250); }
  return [`${name} administered`, 'good'];
}
function fluid(p, name, gain){
  p.blood = clamp(p.blood + gain, 0, 100);
  p.sysBp = clamp(p.sysBp + gain, 0, 200);
  p.diaBp = clamp(p.diaBp + Math.round(gain*.6), 0, 140);
  return [`${name} transfused — volume ${Math.round(p.blood)}%`,'good'];
}
function airway(p, kind){
  if(p.airway === kind) return [kind+' already sited','warn'];
  p.airway = kind; p.spo2 = clamp(p.spo2+4,0,100);
  return [kind+' inserted — airway patent','good'];
}
function partSeverity(pt){
  if(!pt.wounds.length && !pt.fractured) return 0;
  let s = pt.fractured ? 2 : 0;
  pt.wounds.forEach(w => { s = Math.max(s, WOUND_TYPES[w.t].sev); });
  const allTreated = pt.wounds.every(w=>w.bandaged) && (!pt.fractured || pt.splinted);
  return allTreated ? -1 : s;      // -1 == treated
}
function partBleeding(pt){
  if(pt.tourniquet) return 0;
  return pt.wounds.reduce((a,w)=> a + (w.bandaged?0:WOUND_TYPES[w.t].bleed*w.n), 0);
}
function totalBleed(p){ return Object.values(p.parts).reduce((a,pt)=>a+partBleeding(pt),0); }

function log(text, kind){
  const t = new Date(Date.now());
  const ms = Date.now() - S.t0;
  const stamp = [Math.floor(ms/3600000), Math.floor(ms/60000)%60, Math.floor(ms/1000)%60]
                  .map(n=>String(n).padStart(2,'0')).join(':');
  S.log.unshift({stamp, text, kind:kind||''});
  if(S.log.length>200) S.log.pop();
  renderLog();
}
function toast(text){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=text;
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

const SEV_FILL = {
  '-1':'#8fd0f5',  // treated
  '0' :'#e6e9ec',
  '1' :'#f0d47e',
  '2' :'#e08a3c',
  '3' :'#d2352c'
};

function renderBody(){
  const p = S.patient, svg = $('#bodySvg');
  svg.querySelectorAll('.part').forEach(g=>{
    const id = g.dataset.part, pt = p.parts[id];
    const sev = partSeverity(pt);
    const fill = SEV_FILL[String(sev)] || '#e6e9ec';
    g.querySelectorAll('ellipse,path,rect').forEach(s=>{
      s.setAttribute('fill', fill);
      s.setAttribute('stroke','rgba(0,0,0,.55)');
      s.setAttribute('stroke-width','1.2');
    });
    g.classList.toggle('sel', S.sel===id);
    if(S.sel===id){
      g.setAttribute('filter','url(#fGlow)');
      g.querySelectorAll('ellipse,path,rect').forEach(s=>{
        s.setAttribute('stroke','#ffffff'); s.setAttribute('stroke-width','3.4');
      });
    } else {
      g.removeAttribute('filter');
    }
  });

  // overlays: bleeding drips, tourniquet bands, fracture marks
  const fx = svg.querySelector('#fx');
  const anchors = { head:[150,52], torso:[150,200], armR:[80,240], armL:[220,240],
                    legR:[131,450], legL:[169,450] };
  let out = '';
  PARTS.forEach(({id})=>{
    const pt = p.parts[id], [x,y] = anchors[id];
    if(partBleeding(pt) > 0){
      out += `<g class="fxIcon"><circle cx="${x}" cy="${y}" r="6" fill="#c8241c" opacity=".85">
        <animate attributeName="r" values="4;9;4" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".9;.15;.9" dur="1.4s" repeatCount="indefinite"/>
      </circle></g>`;
    }
    if(pt.fractured){
      out += `<g class="fxIcon" transform="translate(${x+16},${y-14})">
        <path d="M-7,7 L7,-7" stroke="${pt.splinted?'#8fd0f5':'#fff'}" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M-9,3 a3,3 0 1,1 4,-4 M9,-3 a3,3 0 1,0 -4,4" stroke="${pt.splinted?'#8fd0f5':'#fff'}"
              stroke-width="2" fill="none"/></g>`;
    }
    if(pt.tourniquet){
      const bx = id.startsWith('arm') ? x : x, by = id.startsWith('arm') ? y-40 : y-70;
      out += `<g class="tqBand"><rect x="${bx-22}" y="${by}" width="44" height="9" rx="2"
        fill="#1c1c1c" stroke="#d9a441" stroke-width="1.4"/>
        <text x="${bx}" y="${by-4}" text-anchor="middle" fill="#d9a441"
              font-size="10" font-family="var(--font)">TQ</text></g>`;
    }
    if(pt.iv>0){
      out += `<g class="fxIcon"><circle cx="${x-16}" cy="${y+10}" r="4" fill="#56a8e0"/></g>`;
    }
  });
  fx.innerHTML = out;
}

function selectPart(id){
  S.sel = (S.sel===id) ? null : id;
  $('#selBar').textContent = S.sel ? pName(S.sel) : 'None';
  $('#selBar').classList.toggle('none', !S.sel);
  renderBody(); renderTreat();
}

function buildToolbar(){
  const tb = $('#toolbar'); tb.innerHTML='';
  TOOLS.forEach((t,i)=>{
    const b = document.createElement('div');
    b.className = 'tool' + (S.tool===t.id?' on':'');
    b.title = t.label + '  ['+(i+1)+']';
    b.innerHTML = ICONS[t.id] + `<span class="kbd">${i+1}</span><span class="badge">!</span>`;
    b.addEventListener('click', ()=>{ S.tool=t.id; buildToolbar(); renderTreat(); });
    tb.appendChild(b);
    if(TOOL_SEPS.has(t.id)){ const s=document.createElement('div'); s.className='toolsep'; tb.appendChild(s); }
  });
}

function renderTreat(){
  const host = $('#treatPanel');
  if(S.tool==='triage'){ renderTriageCard(host); return; }

  const list = ACTIONS[S.tool] || [];
  let html = '';
  list.forEach(a=>{
    if(a.sec){ html += `<div class="sectlabel">${a.sec}</div>`; return; }
    const disabled = a.needsPart && !S.sel;
    html += `<button class="trow" data-act="${a.id}" ${disabled?'disabled':''}>
      <span class="dot ${a.dot||''}"></span>
      <span>${a.label}</span>
      <span class="qty">${disabled ? 'SELECT A LIMB' : (a.note||'')}</span>
    </button>`;
  });
  if(!list.length) html = `<div class="hint">No actions available.</div>`;
  host.innerHTML = html;

  host.querySelectorAll('.trow').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = list.find(x=>x.id===btn.dataset.act);
      if(!a) return;
      const [msg, kind] = a.run(S.patient, S.sel) || ['',''];
      if(S.sel && a.needsPart) S.patient.parts[S.sel].checked = true;
      if(msg){ log(msg, kind); toast(msg); }
      renderAll();
    });
  });
}

      <input id="cfBt" value="${esc(p.bloodTypeKnown ? p.bloodType : 'UNKNOWN — run test')}"></div>
    <div class="cardfield"><label>NOTE</label><input id="cfNote" placeholder="add a note, press Enter"></div>
    <div class="sectlabel">Card Entries</div>
    ${entries}
  `;
  host.querySelectorAll('.tri').forEach(el=>{
    el.addEventListener('click', ()=>{
      p.triage = el.dataset.tri;
      addCard('Triage set — '+p.triage.toUpperCase());
      log('Triage tag applied — '+p.triage.toUpperCase(), p.triage==='immediate'?'bad':'warn');
      renderAll();
    });
  });
  const note = host.querySelector('#cfNote');
  note.addEventListener('keydown', e=>{
    if(e.key==='Enter' && note.value.trim()){
      addCard(note.value.trim()); note.value=''; renderTreat();
    }
  });
  host.querySelector('#cfName').addEventListener('change', e=>{ p.name=e.target.value; renderAll(); });
  host.querySelector('#cfCs').addEventListener('change', e=>{ p.callsign=e.target.value; renderAll(); });
}
function addCard(text){
  const ms = Date.now()-S.t0;
  const stamp = [Math.floor(ms/3600000), Math.floor(ms/60000)%60, Math.floor(ms/1000)%60]
    .map(n=>String(n).padStart(2,'0')).join(':');
  S.patient.triageEntries.unshift({stamp, text});
}

/* ================================================================
   6. OVERVIEW PANEL
   ================================================================ */
function bloodWord(v){
  if(v>=90) return ['','']; if(v>=75) return ['Lost some blood','yel'];
  if(v>=55) return ['Lost a lot of blood','yel']; return ['Lost a dangerous amount of blood','red'];
}
function painWord(v){
  if(v<10) return ''; if(v<40) return 'In minor pain';
  if(v<70) return 'In pain'; return 'In severe pain';
}
function renderOverview(){
  const p = S.patient;
  const bleeding = totalBleed(p) > 0;
  const [bw, bcls] = bloodWord(p.blood);
  const crit = k => k;

  let html = '';
  if(p.cardiacArrest) html += `<div class="ovline red">CARDIAC ARREST</div>`;
  if(bleeding) html += `<div class="ovline red">Bleeding</div>`;
  if(bw) html += `<div class="ovline ${bcls}">${bw}</div>`;
  const pw = painWord(p.pain); if(pw) html += `<div class="ovline">${pw}</div>`;
  if(p.tqCount) html += `<div class="ovline yel">${p.tqCount}× Tourniquet applied</div>`;
  if(!bleeding && !bw && !pw && !p.cardiacArrest) html += `<div class="ovline dim">No apparent injuries.</div>`;

  // vitals block
  const known = k => k;
  html += `
    <div class="vitals">
      ${vitCell('HR', p.cardiacArrest?'0':jitter(p.hr,2), 'bpm', p.hr>120||p.hr<50||p.cardiacArrest?'crit':p.hr>100?'warn':'')}
      ${vitCell('BP', p.cardiacArrest?'0/0':`${jitter(p.sysBp,3)}/${jitter(p.diaBp,2)}`, 'mmHg', p.sysBp<90?'crit':p.sysBp<105?'warn':'')}
      ${vitCell('SpO₂', p.cardiacArrest?'--':jitter(p.spo2,1), '%', p.spo2<90?'crit':p.spo2<95?'warn':'')}
      ${vitCell('RR', p.cardiacArrest?'0':jitter(p.rr,1), '/min', p.rr>24||p.rr<8?'warn':'')}
      ${vitCell('TEMP', p.temp.toFixed(1), '°C', p.temp<35.5?'warn':'')}
      ${vitCell('BLOOD', Math.round(p.blood), '%', p.blood<55?'crit':p.blood<75?'warn':'')}
    </div>
    <canvas id="ecg" width="600" height="112"></canvas>
    <div class="bloodbar"><i style="width:${p.blood}%"></i></div>
  `;

  // per-part injuries
  PARTS.forEach(({id,name})=>{
    const pt = p.parts[id];
    if(!pt.wounds.length && !pt.fractured && !pt.tourniquet && !pt.iv) return;
    html += `<div class="ovpart"><h4>${name}</h4>`;
    if(pt.fractured) html += `<div class="ovline ${pt.splinted?'dim':'red'}">${pt.splinted?'Fractured (splinted)':'Fractured'}</div>`;
    pt.wounds.forEach(w=>{
      const T = WOUND_TYPES[w.t];
      html += `<div class="ovsub ${w.bandaged?'b':''}">${w.bandaged?'[B] ':''}${w.n}× ${T.name}</div>`;
    });
    if(pt.tourniquet) html += `<div class="ovsub" style="color:var(--yellow)">Tourniquet applied</div>`;
    if(pt.iv) html += `<div class="ovsub" style="color:var(--blue)">${pt.iv}× IV access</div>`;
    if(!pt.checked) html += `<div class="ovsub b" style="font-size:12.5px">not yet examined</div>`;
    html += `</div>`;
  });

  if(p.meds.length){
    html += `<div class="ovpart"><h4>Medication</h4><div class="chips">`;
    const counts = {}; p.meds.forEach(m=>counts[m]=(counts[m]||0)+1);
    for(const m in counts) html += `<span class="chip y">${counts[m]}× ${m}</span>`;
    html += `</div></div>`;
  }
  if(p.airway !== 'clear') html += `<div class="ovpart"><h4>Airway</h4><div class="ovsub">${p.airway} in situ</div></div>`;

  $('#ovPanel').innerHTML = html;
  drawECG();
}
function vitCell(k,v,u,cls){
  return `<div class="vit ${cls||''}"><div class="k">${k}</div>
          <div class="v">${v} <small>${u}</small></div></div>`;
}

/* ---- ECG trace ---- */
let ecgPhase = 0;
function drawECG(){
  const c = document.getElementById('ecg'); if(!c) return;
  const ctx = c.getContext('2d'); const W=c.width, H=c.height;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const p = S.patient;
  ctx.strokeStyle = p.cardiacArrest ? '#e03b31' : (p.hr>120?'#e8c343':'#5cbf62');
  ctx.lineWidth=2; ctx.beginPath();
  const mid = H*0.58;
  if(p.cardiacArrest && !p.cprActive){
    ctx.moveTo(0,mid); ctx.lineTo(W,mid);   // flatline
  } else {
    const beatW = clamp(9000/Math.max(p.hr,30), 62, 260);
    for(let x=0;x<W;x++){
      const t = ((x + ecgPhase) % beatW)/beatW;
      let y = 0;
      if(t<0.10) y = Math.sin(t/0.10*Math.PI)*0.14;            // P
      else if(t<0.16) y = 0;
      else if(t<0.19) y = -0.12*((t-0.16)/0.03);               // Q
      else if(t<0.23) y = 1.0*((t-0.19)/0.04) - 0.12;          // R up
      else if(t<0.27) y = 0.88 - 1.25*((t-0.23)/0.04);         // S down
      else if(t<0.32) y = -0.37 + 0.37*((t-0.27)/0.05);
      else if(t<0.55) y = Math.sin((t-0.32)/0.23*Math.PI)*0.26; // T
      y += (Math.random()-0.5)*0.02;
      const py = mid - y*(H*0.42);
      x===0 ? ctx.moveTo(0,py) : ctx.lineTo(x,py);
    }
  }
  ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='11px sans-serif';
  ctx.fillText(p.cardiacArrest? (p.cprActive?'CPR — COMPRESSIONS':'ASYSTOLE') : 'LEAD II', 8, 14);
}

/* ================================================================
   7. DOCKS
   ================================================================ */
function renderLog(){
  $('#logBody').innerHTML = S.log.map(l=>
    `<div class="logline ${l.kind}"><span class="t">${l.stamp}</span><b>${esc(l.text)}</b></div>`
  ).join('') || `<div class="hint">No activity recorded.</div>`;
}
function renderQuick(){
  const p = S.patient;
  const bleeding = totalBleed(p);
  const wounds = Object.values(p.parts).reduce((a,pt)=>a+pt.wounds.reduce((b,w)=>b+w.n,0),0);
  const open = Object.values(p.parts).reduce((a,pt)=>a+pt.wounds.filter(w=>!w.bandaged).reduce((b,w)=>b+w.n,0),0);
  const fx = Object.values(p.parts).filter(pt=>pt.fractured).length;
  const triCls = {minor:'g',delayed:'y',immediate:'r',deceased:'',none:'b'}[p.triage];
  $('#qvBody').innerHTML = `
    <div class="qvgrid">
      <div class="qv"><div class="k">STATUS</div><div class="v" style="color:${p.cardiacArrest?'var(--red)':bleeding?'var(--yellow)':'var(--green)'}">
        ${p.cardiacArrest?'ARREST':bleeding?'BLEEDING':'STABLE'}</div></div>
      <div class="qv"><div class="k">BLOOD VOL</div><div class="v">${Math.round(p.blood)}%</div></div>
      <div class="qv"><div class="k">PAIN</div><div class="v">${Math.round(p.pain)}%</div></div>
      <div class="qv"><div class="k">WOUNDS</div><div class="v">${open} open / ${wounds}</div></div>
      <div class="qv"><div class="k">FRACTURES</div><div class="v">${fx}</div></div>
      <div class="qv"><div class="k">TOURNIQUETS</div><div class="v">${p.tqCount}</div></div>
      <div class="qv qvfull"><div class="k">TRIAGE / BLOOD TYPE / AIRWAY</div>
        <div class="chips">
          <span class="chip ${triCls}">${p.triage==='none'?'UNTAGGED':p.triage.toUpperCase()}</span>
          <span class="chip b">${p.bloodTypeKnown?p.bloodType:'BLOOD TYPE UNKNOWN'}</span>
          <span class="chip">${p.airway==='clear'?'AIRWAY CLEAR':p.airway.toUpperCase()+' SITED'}</span>
          ${p.meds.length?`<span class="chip y">${p.meds.length}× MEDS GIVEN</span>`:''}
        </div>
      </div>
    </div>`;
}

/* ================================================================
   8. SIM LOOP + BOOT
   ================================================================ */
function renderAll(){ renderBody(); renderOverview(); renderQuick(); renderTreat(); renderHeader(); }
function renderHeader(){
  const p = S.patient;
  $('#patName').firstChild.nodeValue = p.name + ' ';
  $('#patSub').textContent = `${p.callsign} · ${p.unit}`;
}

let lastTick = Date.now();
function tick(){
  const now = Date.now(), dt = (now-lastTick)/1000; lastTick = now;
  const p = S.patient;

  // mission clock
  const ms = now - S.t0;
  $('#clock').textContent = 'MISSION ' + [Math.floor(ms/3600000), Math.floor(ms/60000)%60, Math.floor(ms/1000)%60]
    .map(n=>String(n).padStart(2,'0')).join(':');

  // bleeding drains volume
  const bleed = totalBleed(p);
  if(bleed>0 && !p.cardiacArrest){
    p.blood = clamp(p.blood - bleed*dt*0.12, 0, 100);
    p.hr    = clamp(p.hr + bleed*dt*0.05, 40, 190);
    p.sysBp = clamp(p.sysBp - bleed*dt*0.05, 30, 190);
  }
  // pain decays slowly
  p.pain = clamp(p.pain - dt*0.25, 0, 100);
  // crash on severe volume loss
  if(p.blood < 22 && !p.cardiacArrest){
    p.cardiacArrest = true; p.cprActive = false;
    log('CASUALTY IN CARDIAC ARREST — hypovolaemic','bad');
    toast('CARDIAC ARREST');
  }
  ecgPhase += dt * 90;
  renderBody(); renderOverview(); renderQuick();
  requestAnimationFrame(()=>{}); // no-op, keeps things cheap
}

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  const n = parseInt(e.key,10);
  if(n>=1 && n<=TOOLS.length){ S.tool = TOOLS[n-1].id; buildToolbar(); renderTreat(); }
  if(e.key==='Escape'){ S.sel=null; $('#selBar').textContent='None'; $('#selBar').classList.add('none'); renderAll(); }
});

function boot(){
  buildBody(); buildToolbar(); renderAll();
  log('Medical menu opened — casualty NOAH WILLIAMS','');
  log('Right Leg — fractured, 2× medium velocity wound','bad');
  log('Casualty is bleeding','bad');
  renderLog();
  setInterval(tick, 250);
}
boot();

/* ================================================================
   9. INTEGRATION NOTES  (for the live site)
   ----------------------------------------------------------------
   · All state lives in the single `S` object. Swap `S.patient` for a
     record fetched from your backend and call renderAll().
   · Server-authoritative version: keep ACTIONS[].run() as pure
     descriptions and POST {action, part, patientId} instead of
     mutating locally; apply the returned patient state.
   · The sim loop in tick() is cosmetic only — delete it and drive
     vitals from a websocket/poll if the server owns them.
   · PARTS / WOUND_TYPES / ACTIONS are the three tables to edit for
     new limbs, injuries or treatments. Nothing else is hard-coded.
   · Body diagram: BODY_GEOM holds the right-side geometry; the left
     side is mirrored with transform, so edit one side only.
   · No localStorage / external requests anywhere. Fully portable.
   ================================================================ */
</script>
