name: asot
services:
  web:
    build:
      context: .
      dockerfile: apps/web/dockerfile
    container_name: web
    ports:
      - "3000:3000"
    volumes:
      - ./storage/maps:/app/storage/maps
      - ./storage/gallery:/app/storage/gallery
      - ./storage/milpacs:/app/storage/milpacs
      - ./storage/uploads:/app/storage/uploads
      - ./storage/snapshots:/app/storage/snapshots
      - ./storage/db-backups:/app/storage/db-backups
      - ./storage/media-backups:/app/storage/media-backups
      - ./storage/backup-meta:/app/storage/backup-meta
      - ./storage/j1:/app/storage/j1
      - ./storage/j2:/app/storage/j2
      - ./storage/j3:/app/storage/j3
      - ./storage/j4:/app/storage/j4
      - ./storage/j5:/app/storage/j5
      - ./storage/j6:/app/storage/j6
      - ./storage/j7:/app/storage/j7
      - ./storage/hq:/app/storage/hq
      - ./storage/all:/app/storage/all
      - ./storage/members:/app/storage/members
    restart: unless-stopped
    env_file:
      - .env

  bot:
    build:
      context: .
      dockerfile: apps/bot/dockerfile
    container_name: bot
    volumes:
      - ./storage/bot:/app/storage/bot
    restart: unless-stopped
    env_file:
      - .env
