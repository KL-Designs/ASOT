name: asot
services:
  web:
    build:
      context: .
      dockerfile: apps/web/dockerfile
    container_name: web
    ports:
      - "3000:3000"
    volumes:
      - ./storage/maps:/app/storage/maps
      - ./storage/gallery:/app/storage/gallery
      - ./storage/milpacs:/app/storage/milpacs
      - ./storage/uploads:/app/storage/uploads
      - ./storage/snapshots:/app/storage/snapshots
      - ./storage/db-backups:/app/storage/db-backups
      - ./storage/media-backups:/app/storage/media-backups
      - ./storage/backup-meta:/app/storage/backup-meta
      - ./storage/diagnostics:/app/storage/diagnostics
      - ./storage/j1:/app/storage/j1
      - ./storage/j2:/app/storage/j2
      - ./storage/j3:/app/storage/j3
      - ./storage/j4:/app/storage/j4
      - ./storage/j5:/app/storage/j5
      - ./storage/j6:/app/storage/j6
      - ./storage/j7:/app/storage/j7
      - ./storage/hq:/app/storage/hq
      - ./storage/all:/app/storage/all
      - ./storage/members:/app/storage/members
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the .env value, which points at localhost for local `npm start`.
      # Inside compose the service is only addressable by name — it publishes no port.
      MILPAC_SERVICE_URL: http://milpac:42070
    depends_on:
      milpac:
        condition: service_healthy

  milpac:
    build:
      context: .
      dockerfile: apps/milpac/dockerfile
    container_name: milpac
    # Deliberately no `ports:` — web reaches this by service name on compose's
    # default network. Publishing it would expose an image generator to the
    # internet, which is what made the original's own compose file dangerous.
    # See apps/milpac/PLAN.md section 9.
    #
    # Deliberately no `volumes:` either. Every other service bind-mounts part of
    # storage/; this one writes nothing to disk by design and returns bytes for
    # web to persist. That absence is a design decision, not an oversight.
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      # node:22-alpine ships neither curl nor wget, but node 22 has global fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.MILPAC_PORT||42070)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  bot:
    build:
      context: .
      dockerfile: apps/bot/dockerfile
    container_name: bot
    volumes:
      - ./storage/bot:/app/storage/bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Server-to-server calls to web (the /milpac render commands) stay on the
      # compose network instead of going out through the public URL and back in
      # via the reverse proxy. NEXT_PUBLIC_BASEURL is still the public URL and
      # is what member-facing links use — these are two different addresses for
      # the same app and both are needed.
      WEB_INTERNAL_URL: http://web:3000
