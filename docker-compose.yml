services:
  web:
    build: .
    container_name: asot-website
    ports:
      - "3000:3000"
    volumes:
      - ./gallery:/app/gallery
      - ./milpacs:/app/milpacs
      - ./uploads:/app/uploads
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://172.24.0.11:27017/ASOT
      - NEXT_PUBLIC_COLLAB_WS_URL=ws://YOUR_SERVER_IP:1234

  collab:
    build: .
    container_name: asot-collab
    ports:
      - "3001:3001"
    command: node collab-server.mjs
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://172.24.0.11:27017/ASOT
      - COLLAB_PORT=3001
      - WEB_URL=http://YOUR_SERVER_IP:3000
